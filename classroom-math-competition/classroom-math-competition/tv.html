<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Live Team Leaderboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cloudflare.com"></script>
</head>
<body class="tv-page">
  <main class="tv-shell">
    <header class="tv-header">
      <div>
        <div class="eyebrow">CLASSROOM MATH CHALLENGE</div>
        <h1>Team Leaderboard</h1>
        <p id="live-status">Waiting for teams…</p>
      </div>

      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, 0.06); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14);">
          <div id="tv-qrcode" style="width: 88px; height: 88px; border-radius: 8px; background: #ffffff; padding: 6px; display: flex; align-items: center; justify-content: center;"></div>
          <div>
            <div style="font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8;">SCAN TO JOIN</div>
            <div style="font-size: 1rem; font-weight: 700; color: #f8fafc; margin-top: 2px;">btukmath.netlify.app/play</div>
            <div style="font-size: 0.8rem; color: #cbd5e1; margin-top: 2px;">Open phone camera to enter answers</div>
          </div>
        </div>

        <button id="reveal-btn" class="reveal-button" aria-pressed="false">
          <span class="reveal-icon">◉</span> Reveal scores
        </button>
      </div>
    </header>

    <section id="leaderboard" class="leaderboard" aria-live="polite"></section>
    <footer class="tv-footer">
      <span><i class="live-dot"></i> LIVE SCORE UPDATES</span>
      <span id="submission-count">0 / 4 TEAMS SUBMITTED</span>
    </footer>
  </main>

  <script>
    new QRCode(document.getElementById("tv-qrcode"), {
      text: "https://netlify.app",
      width: 76,
      height: 76,
      colorDark: "#080d18",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
  <script type="module" src="/tv.js"></script>
</body>
</html>
