<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Багуудын Онооны Самбар</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="tv-page">
  <main class="tv-shell">
    <header class="tv-header">
      <div>
        <div class="eyebrow">МАТЕМАТИКИЙН БАГИЙН ТЭМЦЭЭН</div>
        <h1>Багуудын Онооны Самбар</h1>
        <p id="live-status">Багуудыг хүлээж байна…</p>
      </div>

      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, 0.06); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14);">
          <div style="width: 96px; height: 96px; border-radius: 8px; background: #ffffff; padding: 6px; display: flex; align-items: center; justify-content: center;">
            <img
              src="/qr.png"
              alt="QR код"
              style="width: 100%; height: 100%; display: block; object-fit: contain;"
            />
          </div>
          <div>
            <div style="font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8;">УНШУУЛЖ НЭГДЭХ</div>
            <div style="font-size: 1rem; font-weight: 700; color: #f8fafc; margin-top: 2px;">btukmath.netlify.app/play</div>
            <div style="font-size: 0.8rem; color: #cbd5e1; margin-top: 2px;">Утасныхаа камераар уншуулж хариугаа оруулна уу</div>
          </div>
        </div>

        <button id="reveal-btn" class="reveal-button" aria-pressed="false">
          <span class="reveal-icon">◉</span> Оноог харуулах
        </button>
      </div>
    </header>

    <section id="leaderboard" class="leaderboard" aria-live="polite"></section>
    <footer class="tv-footer">
      <span><i class="live-dot"></i> ШУУД ШИНЭЧЛЭГДЭЖ БАЙНА</span>
      <span id="submission-count">0 / 4 БАГ ИЛГЭЭСЭН</span>
    </footer>
  </main>
  <script type="module" src="/tv.js"></script>
</body>
</html>
